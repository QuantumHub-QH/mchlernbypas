<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Audio Uploader - MCHLERN (Web)</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        h1 { color: #00ffcc; text-align: center; }
        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 20px; }
        .card h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"], select, textarea { width: 100%; padding: 10px; background-color: #2b2b2b; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        input[type="range"] { width: 100%; }
        .slider-container { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
        button { background-color: #444; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #666; }
        .btn-upload { background-color: #107c10; width: 100%; font-size: 1.1rem; font-weight: bold; padding: 15px; margin-top: 10px; }
        .btn-upload:hover { background-color: #0a500a; }
        .btn-danger { background-color: #b83535; }
        .btn-danger:hover { background-color: #d64949; }
        .templates { display: flex; gap: 10px; margin-bottom: 15px; }
        #history-box { background-color: #121212; border: 1px solid #444; height: 200px; overflow-y: auto; padding: 10px; border-radius: 4px; font-family: monospace; white-space: pre-wrap; }
        #loading { display: none; text-align: center; color: #00aaff; margin-top: 10px; font-weight: bold; }
        .recommendation { color: #00ffcc; font-weight: bold; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>Roblox Audio Uploader - MCHLERN</h1>
    
    <form id="uploadForm">
        <div class="card">
            <h2>1. API CONFIGURATION</h2>
            <div class="form-group">
                <label>API Key:</label>
                <input type="password" id="api_key" required>
            </div>
            <div style="display: flex; gap: 20px;">
                <div class="form-group" style="flex: 1;">
                    <label>Creator Type:</label>
                    <select id="creator_type">
                        <option value="User">User</option>
                        <option value="Group">Group</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 2;">
                    <label>Creator ID:</label>
                    <input type="text" id="creator_id" required>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>2. AUDIO MODIFIER SETTINGS</h2>
            <label>Bypass Templates:</label>
            <div class="templates">
                <button type="button" onclick="setTemplate(1.5)">1.5x</button>
                <button type="button" onclick="setTemplate(1.6)">1.6x</button>
                <button type="button" onclick="setTemplate(2.3)">2.3x</button>
                <button type="button" onclick="setTemplate(2.5)">2.5x</button>
                <button type="button" onclick="setTemplate(1.0)" class="btn-danger">Reset</button>
            </div>
            
            <div class="form-group">
                <label>Speed (Tempo): <span id="speed_val">1.00</span></label>
                <input type="range" id="speed" min="0.5" max="3.0" step="0.01" value="1.0" oninput="updateUI()">
            </div>
            <div class="form-group">
                <label>Pitch: <span id="pitch_val">1.00</span></label>
                <input type="range" id="pitch" min="0.5" max="3.0" step="0.01" value="1.0" oninput="updateUI()">
            </div>
            <div class="form-group">
                <label>Volume: <span id="vol_val">1.00</span></label>
                <input type="range" id="vol" min="0.1" max="3.0" step="0.01" value="1.0" oninput="document.getElementById('vol_val').innerText = this.value">
            </div>
            
            <div class="recommendation" id="rec_label">Rec. In-Game PlaybackSpeed: 1.00</div>
        </div>

        <div class="card">
            <h2>3. UPLOAD CONTROLS</h2>
            <div class="form-group">
                <label>Select Local Audio Files (.mp3, .ogg):</label>
                <input type="file" id="audio_files" multiple accept=".mp3, .ogg" style="color:white;">
            </div>
            <div style="text-align: center; margin: 10px 0; color: #666;">-- OR --</div>
            <div class="form-group">
                <label>Paste YouTube Link(s) (One per line):</label>
                <textarea id="yt_url" rows="4"></textarea>
            </div>
            <button type="submit" class="btn-upload" id="uploadBtn">START UPLOAD</button>
            <div id="loading">Processing & Uploading... Please wait!</div>
        </div>
    </form>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 10px;">
            <h2 style="border: none; margin: 0; padding: 0;">UPLOAD HISTORY</h2>
            <button type="button" class="btn-danger" onclick="clearHistory()">Clear History</button>
        </div>
        <div id="history-box"></div>
    </div>
</div>

<script>
    function updateUI() {
        let speed = document.getElementById('speed').value;
        let pitch = document.getElementById('pitch').value;
        document.getElementById('speed_val').innerText = parseFloat(speed).toFixed(2);
        document.getElementById('pitch_val').innerText = parseFloat(pitch).toFixed(2);
        
        let rec = (1.0 / speed).toFixed(2);
        let recLabel = document.getElementById('rec_label');
        if (speed !== pitch) {
            recLabel.innerText = `Rec. In-Game PlaybackSpeed: ${rec} (Pitch mismatch!)`;
            recLabel.style.color = "#ffcc00";
        } else {
            recLabel.innerText = `Rec. In-Game PlaybackSpeed: ${rec}`;
            recLabel.style.color = "#00ffcc";
        }
    }

    function setTemplate(val) {
        document.getElementById('speed').value = val;
        document.getElementById('pitch').value = val;
        updateUI();
    }

    async function fetchHistory() {
        let res = await fetch('/history');
        let data = await res.json();
        let box = document.getElementById('history-box');
        box.innerHTML = '';
        data.reverse().forEach(h => {
            box.innerHTML += `[${h.time}] ${h.filename} | ${h.status} | AssetID: ${h.asset_id || '-'}\n`;
        });
    }

    async function clearHistory() {
        if(confirm("Are you sure?")) {
            await fetch('/clear_history', { method: 'POST' });
            fetchHistory();
        }
    }

    document.getElementById('uploadForm').onsubmit = async (e) => {
        e.preventDefault();
        
        let fd = new FormData();
        fd.append('api_key', document.getElementById('api_key').value);
        fd.append('creator_type', document.getElementById('creator_type').value);
        fd.append('creator_id', document.getElementById('creator_id').value);
        fd.append('speed', document.getElementById('speed').value);
        fd.append('pitch', document.getElementById('pitch').value);
        fd.append('vol', document.getElementById('vol').value);
        fd.append('yt_url', document.getElementById('yt_url').value);
        
        let files = document.getElementById('audio_files').files;
        for(let i=0; i<files.length; i++) {
            fd.append('audio_files', files[i]);
        }
        
        if(files.length === 0 && !document.getElementById('yt_url').value.trim()) {
            alert("Please select files or enter YouTube links!");
            return;
        }

        document.getElementById('uploadBtn').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        try {
            await fetch('/upload', { method: 'POST', body: fd });
            fetchHistory();
            document.getElementById('audio_files').value = '';
            document.getElementById('yt_url').value = '';
            alert("Upload Process Completed!");
        } catch(err) {
            alert("Error: " + err);
        } finally {
            document.getElementById('uploadBtn').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }
    };

    // Initial load
    fetchHistory();
</script>
</body>
</html>
